# One file for every environment: values that change per environment are placeholders with a local
# default, overridden by environment variables from the Deployment (configuration guide, step 1).
spring:
  application:
    name: orders
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1500000
      keepalive-time: 120000
      leak-detection-threshold: 60000
      schema: orders
      data-source-properties:
        ApplicationName: orders
  transaction:
    default-timeout: 10s
  jdbc:
    template:
      query-timeout: 5s
  liquibase:
    enabled: false
    default-schema: orders
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8090/default}
          audiences: ${OIDC_AUDIENCE:monorepo}
          jws-algorithms: RS256
  docker:
    compose:
      lifecycle-management: start-only

server:
  request:
    header:
      forwarded:
        strategy: web-server

logging:
  structured:
    format:
      console: ecs

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,migrations
  opentelemetry:
    resource-attributes:
      service.version: ${APP_VERSION:dev}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:local}
  otlp:
    metrics:
      export:
        base-time-unit: seconds
        step: 30s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

