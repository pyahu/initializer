# orders on the laptop: `./gradlew :orders:bootRun` starts these containers and Spring Boot connects to them
# (local development guide; monorepo guide, step 8). Names start with the vertical's, so the root compose.yaml
# can run every vertical together. Every file names the platform's Compose project, so verticals started one by
# one share Grafana and the identity provider instead of fighting over their ports. Never in production.
name: monorepo
include:
  - ../../platform.compose.yaml
services:
  # One user on the laptop; db/init-local.sh still creates the two roles of production (database guide, step 4).
  orders-postgres:
    image: postgres:18.7@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    environment:
      POSTGRES_PASSWORD: local
      POSTGRES_DB: orders
    ports:
      - "5432"
    # Over TCP: the server that runs the init scripts listens on a socket only, so this waits for the real one.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -d orders"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ./db:/db:ro
      - ./db/init-local.sh:/docker-entrypoint-initdb.d/init-local.sh:ro
