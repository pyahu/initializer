# Dev: its namespace and values. A tag is fine here while you rebuild the same image often.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: billing-dev

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: billing-config
    behavior: merge
    literals:
      - DEPLOYMENT_ENVIRONMENT=dev
      - TRACING_SAMPLING_PROBABILITY=1.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability:4318
      - OIDC_ISSUER_URI=https://login.example.com/your-tenant
      - OIDC_AUDIENCE=monorepo

images:
  - name: billing
    newName: ghcr.io/your-org/billing
    newTag: dev

patches:
  # One zone is common in dev: a strict zone rule would leave pods pending.
  - target:
      kind: Deployment
      name: billing
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: ScheduleAnyway
  - target:
      kind: HorizontalPodAutoscaler
      name: billing
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
