name: Start service

on:
  push:
    branches: [main]
    paths:
      - services/start/**
      - frontends/start-web/**
      - templates/**
      - build-logic/**
      - gradle/**
      - settings.gradle.kts
      - gradlew
      - gradlew.bat
      - data/versions.yaml
      - cmd/runworkflow/**
      - go.mod
      - go.sum
      - .dockerignore
      - .gitattributes
      - .github/workflows/start.yml
  pull_request:
    paths:
      - services/start/**
      - frontends/start-web/**
      - templates/**
      - build-logic/**
      - gradle/**
      - settings.gradle.kts
      - gradlew
      - gradlew.bat
      - data/versions.yaml
      - cmd/runworkflow/**
      - go.mod
      - go.sum
      - .dockerignore
      - .gitattributes
      - .github/workflows/start.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: start-${{ github.ref }}
  # Every consumer downloads this run's image, so a newer candidate can replace an older one.
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.2
  JDK_IMAGE: eclipse-temurin@sha256:80f67fb3d6f76e2d817d98a4cc2a9cf05f054d4e6adc5e2144bde671d722e63f
  # The Node of frontends/start-web/.node-version, pinned by digest.
  NODE_IMAGE: node:24.22.3-trixie-slim@sha256:af02d57b57719b9657a45199a79264a9437940cd55b3c7b3fc99615654f124a0
  # The browsers of the @playwright/test version in frontends/start-web/package.json.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf

jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep the output parent owned by the runner before the container writes Gradle output as root.
      - name: Manifest output directory
        run: mkdir -p build/manifests
      - name: Gradle build in the pinned JDK
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$JDK_IMAGE" sh -c \
            './gradlew --no-daemon build && ./gradlew --no-daemon -p build-logic test'
      - name: Render the dev overlay
        uses: docker://registry.k8s.io/kustomize/kustomize:v5.8.3@sha256:429eda4a1c76a7de458d0c4ca3ded9b5d764899ff6bdaeccc1d98b1b6ee873e4
        with:
          args: build services/start/deploy/overlays/dev --output build/manifests/dev.yaml
      - name: Render the prod overlay
        uses: docker://registry.k8s.io/kustomize/kustomize:v5.8.3@sha256:429eda4a1c76a7de458d0c4ca3ded9b5d764899ff6bdaeccc1d98b1b6ee873e4
        with:
          args: build services/start/deploy/overlays/prod --output build/manifests/prod.yaml
      - name: Strict schemas for Kubernetes 1.36
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        with:
          args: -strict -summary -kubernetes-version 1.36.0 build/manifests
      - name: Strict schemas for Kubernetes 1.37
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        with:
          args: -strict -summary -kubernetes-version 1.37.0 build/manifests
      - name: Manifest lint
        uses: docker://ghcr.io/stackrox/kube-linter:v0.8.3@sha256:f2bfce7879206d32f69ab6572c376f916643f54ca291ac38cf7d01ef591ff3f9
        with:
          args: lint build/manifests
      - name: Manifest security
        uses: docker://aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
        with:
          args: config --exit-code 1 --severity HIGH,CRITICAL build/manifests
      - name: Deprecated or removed APIs
        uses: docker://us-docker.pkg.dev/fairwinds-ops/oss/pluto:v5.24.5@sha256:2569f881ad57999772755a3e56eef5d35f5b4b9498f7cfb89e68ac19eba0532f
        with:
          args: detect-files -d build/manifests --target-versions k8s=v1.37.0
      - name: Image
        run: docker buildx build --load -t start:ci -f services/start/Dockerfile .
      - name: Export the built image for scanning
        run: docker save start:ci -o build/start-image.tar
      - name: Backend image vulnerabilities
        uses: docker://aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
        with:
          args: image --input build/start-image.tar --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --cache-dir build/trivy-cache
      - name: Smoke
        run: |
          docker run -d --name start -p 8081:8081 -e MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=false start:ci
          for _ in $(seq 1 60); do
            if curl -sf localhost:8081/actuator/health/readiness; then exit 0; fi
            sleep 1
          done
          docker logs start
          exit 1
      - name: Keep the image for the generated projects
        run: |
          docker image inspect --format '{{.Id}}' start:ci > start-image.id
          gzip -c build/start-image.tar > start-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-image
          path: |
            start-image.tar.gz
            start-image.id
          retention-days: 1

  # The page: its types against the contract, its image, then the form, Explore and the download in a browser,
  # against the service image of the job above.
  web:
    needs: start
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: start-image
      - name: Types match the contract
        run: >-
          docker run --rm -v "$PWD:/w" -w /w/frontends/start-web "$NODE_IMAGE"
          sh -c 'npm ci --no-audit --no-fund && npm audit --audit-level=high && npm run api:check'
      - name: Image
        run: docker buildx build --load -t start-web:ci frontends/start-web
      - name: Export the built frontend image for scanning
        run: |
          mkdir -p build
          docker save start-web:ci -o build/web-image.tar
      - name: Frontend image vulnerabilities
        uses: docker://aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
        with:
          args: image --input build/web-image.tar --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --cache-dir build/trivy-cache
      - name: The page in a browser
        # The containers run the way the pods do: read-only root, a writable /tmp and a user that is not root.
        run: |
          trap 'code=$?; set +e; if [ $code -ne 0 ]; then for c in start web; do docker logs $c 2>&1 | tail -40; done; fi
            docker rm -f start web > /dev/null 2>&1; docker network rm e2e > /dev/null 2>&1; exit $code' EXIT
          ready() { for _ in $(seq 1 60); do curl -sf "$1" > /dev/null && return 0; sleep 1; done; return 1; }
          gunzip -c start-image.tar.gz | docker load
          test "$(docker image inspect --format '{{.Id}}' start:ci)" = "$(cat start-image.id)"
          docker network create e2e > /dev/null
          docker run -d --name start --network e2e -p 18081:8081 --read-only --tmpfs /tmp --user 10001:10001 \
            -e MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=false start:ci
          ready localhost:18081/actuator/health/readiness
          docker run -d --name web --network e2e -p 3000:3000 --read-only --tmpfs /tmp --tmpfs /web/.next/cache \
            --user 1000:1000 -e API_BASE_URL=http://start:8080 start-web:ci
          ready localhost:3000/livez
          docker run --rm --network e2e --ipc=host -v "$PWD/frontends/start-web:/web" -w /web \
            -e BASE_URL=http://web:3000 -e CI=true "$PLAYWRIGHT_IMAGE" \
            sh -c 'npm ci --no-audit --no-fund && npx playwright test'

  # Every supported combination, generated through the HTTP API of the image above, then built and started by the
  # generated project's own workflow. Two package lengths, so formatting cannot depend on the one we test with.
  generated:
    needs: start
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        architecture: [hexagonal, ddd-layered]
        database: [none, postgres]
        auth: [none, oidc]
        frontend: [none, nextjs]
        include:
          - architecture: hexagonal
            name: orders
            group: com.example
          - architecture: ddd-layered
            name: billing-history
            group: org.zeta.platform.services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: start-image
      - name: Start the service
        run: |
          gunzip -c start-image.tar.gz | docker load
          test "$(docker image inspect --format '{{.Id}}' start:ci)" = "$(cat start-image.id)"
          docker run -d --name start -p 18080:8080 -p 18081:8081 -e MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=false start:ci
          for _ in $(seq 1 60); do
            if curl -sf localhost:18081/actuator/health/readiness; then exit 0; fi
            sleep 1
          done
          docker logs start
          exit 1
      - name: Generate, twice
        # POST with form fields as curl -d sends them, then GET with the same fields as a query: same bytes.
        env:
          NAME: ${{ matrix.name }}
          GROUP: ${{ matrix.group }}
          ARCHITECTURE: ${{ matrix.architecture }}
          DATABASE: ${{ matrix.database }}
          AUTH: ${{ matrix.auth }}
          FRONTEND: ${{ matrix.frontend }}
        run: |
          mkdir -p out
          curl -fsS localhost:18080/starter.zip -d name="$NAME" -d group="$GROUP" -d architecture="$ARCHITECTURE" \
            -d database="$DATABASE" -d auth="$AUTH" -d frontend="$FRONTEND" -o out/post.zip
          curl -fsS "localhost:18080/starter.zip?name=$NAME&group=$GROUP&architecture=$ARCHITECTURE&database=$DATABASE&auth=$AUTH&frontend=$FRONTEND" \
            -o out/get.zip
          cmp out/post.zip out/get.zip
          cd out && unzip -q post.zip
          test -x "$NAME/gradlew"
      - name: The generated project's own workflow
        run: go run ./cmd/runworkflow -dir "out/${{ matrix.name }}"
