# Stage 1 fixture: build, image, acceptance, evidence.
name: Fixture single-hexagonal

on:
  push:
    branches: [main]
    paths:
      - fixtures/single-hexagonal/**
      - acceptance/**
      - data/versions.yaml
      - data/evidence/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/fixture-single-hexagonal.yml
  pull_request:
    paths:
      - fixtures/single-hexagonal/**
      - acceptance/**
      - data/versions.yaml
      - data/evidence/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/fixture-single-hexagonal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixture-single-hexagonal-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: go1.27.2
  # temurin-jdk-image of baseline v0.1-b1.
  JDK_IMAGE: eclipse-temurin@sha256:a75cd2f1bd3e1e45da898bf658f1f1039ab7392b34844862514d230fd6a516d4

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
      - name: Go toolchain
        run: test "$(go version | cut -d' ' -f3)" = go1.27.2
      - name: Gradle build in the pinned JDK
        id: gradle
        run: docker run --rm -v "$PWD/fixtures/single-hexagonal:/w" -w /w "$JDK_IMAGE" ./gradlew --no-daemon build
      - name: Image
        id: image
        run: docker buildx build --load -t single-hexagonal:ci fixtures/single-hexagonal
      - name: Acceptance
        id: acceptance
        # -p 1: one package at a time, so the observability containers never disturb the startup measurement.
        run: |
          mkdir -p out
          go test -tags acceptance -count=1 -p 1 -json ./acceptance/... > out/acceptance.json
      - name: Evidence
        if: always()
        run: |
          mkdir -p out
          go run ./cmd/guidekit evidence verify --fixture single-hexagonal \
            --gradle-outcome "${{ steps.gradle.outcome }}" \
            --go-test-json out/acceptance.json \
            --junit fixtures/single-hexagonal/build/test-results \
            --sbom fixtures/single-hexagonal/build/sbom/bom.json \
            --image single-hexagonal:ci \
            --out out/evidence-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-report
          path: out/evidence-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance-json
          path: out/acceptance.json
          if-no-files-found: warn
