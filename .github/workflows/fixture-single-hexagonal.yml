# Stage 1 fixture: build, image, acceptance, evidence.
name: Fixture single-hexagonal

on:
  push:
    branches: [main]
    paths:
      - fixtures/single-hexagonal/**
      - templates/postgres/db/**
      - templates/postgres/src/main/resources/db/changelog/**
      - acceptance/**
      - data/versions.yaml
      - data/evidence/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/fixture-single-hexagonal.yml
  pull_request:
    paths:
      - fixtures/single-hexagonal/**
      - templates/postgres/db/**
      - templates/postgres/src/main/resources/db/changelog/**
      - acceptance/**
      - data/versions.yaml
      - data/evidence/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/fixture-single-hexagonal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixture-single-hexagonal-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: go1.27.2
  # temurin-jdk-image of baseline v0.1-b2.
  JDK_IMAGE: eclipse-temurin@sha256:80f67fb3d6f76e2d817d98a4cc2a9cf05f054d4e6adc5e2144bde671d722e63f

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
      - name: Go toolchain
        run: test "$(go version | cut -d' ' -f3)" = go1.27.2
      - name: Gradle build in the pinned JDK
        id: gradle
        # The permission test copies the real SQL/changelog templates and starts PostgreSQL through Docker.
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo/fixtures/single-hexagonal
          -v /var/run/docker.sock:/var/run/docker.sock "$JDK_IMAGE" ./gradlew --no-daemon build
      - name: Image
        id: image
        run: docker buildx build --load -t single-hexagonal:ci fixtures/single-hexagonal
      - name: Export the built image for scanning
        run: |
          mkdir -p out
          docker save single-hexagonal:ci -o out/fixture-image.tar
      - name: Image vulnerabilities
        uses: docker://aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
        with:
          args: image --input out/fixture-image.tar --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --cache-dir out/trivy-cache
      - name: Acceptance
        id: acceptance
        # -p 1: one package at a time, so the observability containers never disturb the startup measurement.
        run: |
          mkdir -p out
          go test -tags acceptance -count=1 -p 1 -json ./acceptance/... > out/acceptance.json
      - name: Evidence
        if: always()
        run: |
          mkdir -p out
          go run ./cmd/guidekit evidence verify --fixture single-hexagonal \
            --gradle-outcome "${{ steps.gradle.outcome }}" \
            --go-test-json out/acceptance.json \
            --junit fixtures/single-hexagonal/build/test-results \
            --sbom fixtures/single-hexagonal/build/sbom/bom.json \
            --image single-hexagonal:ci \
            --out out/evidence-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-report
          path: out/evidence-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance-json
          path: out/acceptance.json
          if-no-files-found: warn
