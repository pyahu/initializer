# Checklist records. See CONTRIBUTING.md, "Checklist". Ported from the source guides'
# checklists; every item is documented, none is enforced by a generated test yet.
- id: JVM-01
  guide: jvm-in-containers
  card: jvm-heap-sizing
  type: generated-config
  text: Memory request equals memory limit.
  claim: documented
  tests: []
  appliesWhen: {}
- id: JVM-02
  guide: jvm-in-containers
  card: jvm-heap-sizing
  type: generated-config
  text: MaxRAMPercentage set from the table, InitialRAMPercentage equal to it.
  claim: documented
  tests: []
  appliesWhen: {}
- id: JVM-03
  guide: jvm-in-containers
  card: jvm-gc-explicit
  type: generated-config
  text: GC flag explicit in the ENTRYPOINT (-XX:+UseG1GC unless ZGC or Parallel is documented).
  claim: documented
  tests: []
  appliesWhen: {}
- id: JVM-04
  guide: jvm-in-containers
  card: jvm-cpu-count
  type: generated-config
  text: No CPU limit and ActiveProcessorCount equal to the CPU request rounded up, at least 2; with a CPU limit, no ActiveProcessorCount.
  claim: documented
  tests: []
  appliesWhen: {}
- id: JVM-05
  guide: jvm-in-containers
  card: jvm-heap-sizing
  type: generated-config
  text: ExitOnOutOfMemoryError set; heap dumps only to a volume larger than the heap.
  claim: documented
  tests: []
  appliesWhen: {}
- id: JVM-06
  guide: jvm-in-containers
  card: jvm-flag-placement
  type: generated-config
  text: java.io.tmpdir and ErrorFile point at the writable /tmp volume, with ErrorFile on the ENTRYPOINT.
  claim: documented
  tests: []
  appliesWhen: {}
- id: JVM-07
  guide: jvm-in-containers
  card: jvm-aot-cache
  type: generated-config
  text: AOT cache built in the image from the extracted layout, without --launcher, with remote calls disabled in the training run.
  claim: documented
  tests: []
  appliesWhen: {}
- id: JVM-08
  guide: jvm-in-containers
  card: jvm-aot-cache
  type: verified-behaviour
  text: CI fails the build if the cache is rejected (-XX:AOTMode=on check).
  claim: documented
  tests: []
  appliesWhen: {}
- id: JVM-09
  guide: jvm-in-containers
  card: jvm-aot-cache
  type: generated-config
  text: Flags that affect the cache (GC, compact headers) are identical in training and production.
  claim: documented
  tests: []
  appliesWhen: {}
- id: JVM-10
  guide: jvm-in-containers
  card: jvm-startup-probe
  type: deployment-prerequisite
  text: startupProbe budget about three times measured p99 startup on the smallest node type, measured with the AOT cache.
  claim: documented
  tests: []
  appliesWhen: {}
- id: JVM-11
  guide: jvm-in-containers
  card: jvm-heap-sizing
  type: operator-task
  text: Confirm the heap percentage with Native Memory Tracking under load after each JDK or Boot upgrade.
  claim: documented
  tests: []
  appliesWhen: {}
