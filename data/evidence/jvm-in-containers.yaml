# Tested claims of this guide. See CONTRIBUTING.md, "Evidence".
- id: ev-jvm-heap-sizing-1
  card: jvm-heap-sizing
  claim: "With -XX:MaxRAMPercentage=75 and a 1 GiB memory limit, MaxHeapSize is 805306368 bytes, 75% of the limit."
  badge: reproduced
  test: acceptance/jvm::TestHeapIsSeventyFivePercent
  result: "--memory=1g -XX:MaxRAMPercentage=75: MaxHeapSize = 805306368"
  limitations: "Flags only. Native memory under load is not measured here."
- id: ev-jvm-gc-explicit-1
  card: jvm-gc-explicit
  claim: "With one CPU and 4 GiB and no GC flag, the JVM picks SerialGC."
  badge: reproduced
  test: acceptance/jvm::TestSerialGCOneCPU
  result: "--cpus=1 --memory=4g, no GC flag: UseSerialGC = true, UseG1GC = false"
  limitations: "Docker CPU and memory limits on one runner, not a Kubernetes node."
- id: ev-jvm-gc-explicit-2
  card: jvm-gc-explicit
  claim: "With two CPUs and 1700 MiB and no GC flag, the JVM picks SerialGC."
  badge: reproduced
  test: acceptance/jvm::TestSerialGCLowMemory
  result: "--cpus=2 --memory=1700m, no GC flag: UseSerialGC = true"
  limitations: "1700 MiB and 2048 MiB bracket the threshold of about 1792 MiB; they do not locate it."
- id: ev-jvm-gc-explicit-3
  card: jvm-gc-explicit
  claim: "With two CPUs and 2048 MiB and no GC flag, the JVM picks G1."
  badge: reproduced
  test: acceptance/jvm::TestG1AboveThresholds
  result: "--cpus=2 --memory=2048m, no GC flag: UseG1GC = true"
  limitations: "None known."
- id: ev-jvm-gc-explicit-4
  card: jvm-gc-explicit
  claim: "-XX:+UseG1GC selects G1 in both cases where the JVM would pick SerialGC."
  badge: reproduced
  test: acceptance/jvm::TestExplicitG1
  result: "-XX:+UseG1GC at 1 CPU / 4 GiB and at 2 CPUs / 1700 MiB: UseG1GC = true"
  limitations: "None known."
- id: ev-jvm-cpu-count-1
  card: jvm-cpu-count
  claim: "With no CPU limit, -XX:ActiveProcessorCount=1 overrides the CPU count the JVM detects."
  badge: reproduced
  test: acceptance/jvm::TestActiveProcessorCountOverride
  result: "no CPU limit, nproc 4; -XX:ActiveProcessorCount=1 reports Effective CPU Count: 1"
  limitations: "Proves the override only, not the resulting pool sizes."
- id: ev-jvm-flag-placement-1
  card: jvm-flag-placement
  claim: "The image starts with a read-only root filesystem, /tmp as tmpfs, as UID 10001 and with an unreachable OTLP endpoint: /readyz answers 200 within 60 s."
  badge: reproduced
  test: acceptance/jvm::TestHardenedStartup
  result: "read-only root, /tmp tmpfs, UID 10001, unreachable OTLP endpoint: /readyz 200 after 1.4 s"
  limitations: "Docker flags stand in for the pod security context; no cluster run yet."
- id: ev-jvm-aot-cache-1
  card: jvm-aot-cache
  claim: "The AOT cache built in the image is usable with the image's GC and class path: -XX:AOTMode=on exits 0."
  badge: reproduced
  test: acceptance/jvm::TestAOTCacheFailFast
  result: "AOTMode=on with the image's GC and class path: exit 0 (openjdk version \"25.0.5.1\" 2026-11-17 LTS)"
  limitations: "The training run warns that a few Spring ClassFile reader classes cannot be archived; the cache is still used."
- id: ev-jvm-aot-cache-2
  card: jvm-aot-cache
  claim: "The unchanged ENTRYPOINT opens the cache: with -Xlog:aot the JVM logs Opened AOT cache /app/app.aot."
  badge: reproduced
  test: acceptance/jvm::TestAOTCacheLoadedOnLaunch
  result: "unchanged ENTRYPOINT with -Xlog:aot logs \"Opened AOT cache /app/app.aot.\""
  limitations: "The log text was read from the first run on 25.0.5.1+2 and may change with the JDK."
- id: ev-jvm-aot-cache-3
  card: jvm-aot-cache
  claim: "The AOT cache shortens startup of the stage 1 fixture on two CPUs and 1 GiB."
  badge: measured
  test: acceptance/jvm::TestAOTStartupDelta
  run: https://github.com/pyahu/initializer/actions/runs/43912675718/attempts/1
  date: "2026-11-16"
  result: "process running for (s), --cpus=2 --memory=1g, 10 alternating rounds. AOT off [2.60 2.62 2.69 2.56 2.59 2.65 2.58 2.61 2.71 2.63] median 2.617; AOT on [1.55 1.60 1.50 1.52 1.55 1.50 1.45 1.42 1.55 1.59] median 1.533; delta 1.084 s (1.71x)"
  measurement:
    samples: 20
    statistic: "median per mode"
    unit: "seconds (Boot's process running for)"
    protocol: "One discarded warm-up per mode, then 10 rounds alternating -XX:AOTMode=off and the default, --cpus=2 --memory=1g."
  limitations: "A one-endpoint service; a real service loads more classes. x64 only; arm64 is not exercised."
