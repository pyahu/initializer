# Evidence records for the jvm-in-containers guide. See CONTRIBUTING.md, "Evidence".
- id: ev-jvm-heap-sizing-1
  card: jvm-heap-sizing
  claim: "With -XX:MaxRAMPercentage=75 and a 1 GiB memory limit, MaxHeapSize is 805306368 bytes, 75% of the limit."
  badge: reproduced
  capabilities: [runtime]
  components: [java, temurin-jre-image]
  baseline: v0.1-b1
  fixture: single-hexagonal
  test: acceptance/jvm::TestHeapIsSeventyFivePercent
  commands:
    - "docker buildx build --load -t single-hexagonal:ci fixtures/single-hexagonal"
    - "go test -tags acceptance -count=1 -run '^TestHeapIsSeventyFivePercent$' ./acceptance/jvm"
  environment: "GitHub-hosted ubuntu-24.04 x64 runner, Docker, images by digest from baseline v0.1-b1"
  run: https://github.com/pyahu/initializer/actions/runs/39055415247/attempts/1
  commit: 91cc032efb55dc1cc050624eba1e77896f59e833
  date: "2026-10-17"
  result: "--memory=1g -XX:MaxRAMPercentage=75: MaxHeapSize = 805306368"
  limitations: "Flags only. Native memory under load is not measured here."
