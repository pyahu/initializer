- id: ev-test-real-database-1
  card: test-real-database
  claim: "A PostgreSQLContainer bean annotated with @ServiceConnection connects Spring Boot to a real PostgreSQL in tests and @DataJdbcTest keeps it instead of an embedded database."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "From the Spring Boot 4.1 Testcontainers reference and the AutoConfigureTestDatabase source (default Replace.NON_TEST)."
  reason: "The example service has no database yet, so no Testcontainers test runs."
- id: ev-test-outbound-http-1
  card: test-outbound-http
  claim: "@RestClientTest starts the named client with a RestClient.Builder and a MockRestServiceServer that answers as told."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "From the Spring Boot 4.1 testing reference."
  reason: "The example service makes no outbound HTTP call, so there is no client to test."
- id: ev-test-context-cache-1
  card: test-context-cache
  claim: "Spring caches a test context per unique configuration in the same JVM, with a default maximum of 32 contexts evicted least recently used. Bean overrides such as @MockitoBean are part of the cache key."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "From the Spring Framework 7.0 reference, Context Caching; Gradle's forkEvery default of 0 from the Gradle 9.8.1 user guide."
  reason: "The example service has a single Spring test, so there is no cache behaviour to measure."
