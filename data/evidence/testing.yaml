  claim: "The example service's tests compile and run with spring-boot-starter-webmvc-test from the Spring Boot 4.1.2 BOM."
  badge: compiled
  test: gradle/single-hexagonal::ApplicationTest
  limitations: "Proves the test starter resolves and a @SpringBootTest runs; no @WebMvcTest slice exists in the example service yet."
- id: ev-test-architecture-1
  card: test-architecture
  claim: "ApplicationModules.of(Application.class).verify() passes on the example service with Spring Modulith 2.1.1."
  badge: compiled
  test: gradle/single-hexagonal::ModulithTest
  limitations: "The example service has one module, so the test proves the setup, not that a cycle or an internal access is caught."
- id: ev-test-architecture-2
  card: test-architecture
  claim: "The jMolecules hexagonal rule in STRICT mode and two ArchUnit rules pass on the example service with ArchUnit 1.5.1 and jmolecules-archunit 0.33.0."
  badge: compiled
  test: gradle/single-hexagonal::ArchitectureTest
  limitations: "Proves the rules pass on a compliant code base; no test plants a violation to show the rules fail."
- id: ev-test-image-1
  card: test-image
  claim: "A Go test starts the built image with Docker on a read-only root filesystem as UID 10001 and asserts that /readyz answers 200 within 60 s."
  badge: reproduced
  test: acceptance/jvm::TestHardenedStartup
  result: "read-only root, /tmp tmpfs, UID 10001, unreachable OTLP endpoint: /readyz 200 after 1.4 s"
  limitations: "Docker flags stand in for the pod security context; no cluster run yet."
