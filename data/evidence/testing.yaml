# Evidence records for the testing guide. See CONTRIBUTING.md, "Evidence".
- id: ev-test-layers-1
  card: test-layers
  claim: "Most tests should be fast domain and slice tests, with few tests that start the whole application or the image."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "A recommendation about where to spend tests; no test measures the shape of a suite."
  reason: "Engineering judgment backed by the Spring Boot testing reference; there is nothing to run."
- id: ev-test-domain-1
  card: test-domain
  claim: "Domain classes with no Spring dependency can be tested with plain JUnit and AssertJ, without a Spring context."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "The example service has no business rule worth a domain test yet."
  reason: "The example service's domain is a single record; no domain unit test exists to run."
