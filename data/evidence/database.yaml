  reason: "The fixture's PostgreSQL permission test does not exercise this behavior."
- id: ev-db-query-timeouts-2
  card: db-query-timeouts
  claim: "A statement_timeout set on the runtime role cancels a query on the server even when the client is gone."
  badge: not-exercised
  baseline: v0.1-b2
  limitations: "PostgreSQL documented behaviour."
  reason: "The fixture's PostgreSQL permission test does not exercise this behavior."
- id: ev-db-roles-1
  card: db-roles
  claim: "The migration role owns the schema. The runtime role writes business data, cannot drop tables, and can read but not insert/update/delete Liquibase history or lock records."
  badge: reproduced
  capabilities: [test, runtime]
  components: [liquibase, pgjdbc, testcontainers, postgres-image]
  baseline: v0.1-b2
  fixture: single-hexagonal
  test: gradle/single-hexagonal::DatabaseRolesTest
  commands: ["./gradlew -p fixtures/single-hexagonal test --tests io.pyahu.fixture.hexagonal.DatabaseRolesTest"]
  environment: "GitHub-hosted ubuntu-24.04 x64; Temurin 25.0.5+8 container; PostgreSQL 18.6 pinned by digest, Liquibase 5.0.4, PGJDBC 42.7.14, Testcontainers 2.0.5."
  run: https://github.com/pyahu/initializer/actions/runs/44390746843/attempts/1
  commit: e2584f5802881793d9709a0880cc1448bd488e7b
  date: "2026-11-18"
  result: "DatabaseRolesTest: 6 tests, 0 failures, 0 errors, 0 skipped. The migrator owns the schema and its tables. Runtime business CRUD and metadata SELECT succeed; CREATE/ALTER/DROP and all six history/lock writes are rejected with SQLSTATE 42501."
  limitations: "A test-only PostgreSQL container uses the generated role script and changelog. This does not prove Spring Boot data source wiring, pooling, readiness, concurrent migrations or production rollout behavior."
- id: ev-db-migrations-1
  card: db-migrations
  claim: "With spring.liquibase.enabled true, the Spring Boot default, every pod runs the changelog at startup and Liquibase serialises them with its DATABASECHANGELOGLOCK table."
  badge: not-exercised
  baseline: v0.1-b2
  limitations: "Default and table name read from the Spring Boot Liquibase configuration metadata; locking behaviour from the Liquibase documentation."
  reason: "The permission test invokes Liquibase directly; no test starts competing Spring Boot pods or exercises migration locking."
- id: ev-db-expand-contract-1
  card: db-expand-contract
  claim: "During a rolling update the old and new release run against the same schema, so each schema change must work with both."
  badge: not-exercised
  baseline: v0.1-b2
  limitations: "Reasoned from Kubernetes rolling updates; the source guide ran the full rename sequence on PostgreSQL 17 with Flyway, not Liquibase."
  reason: "The permission test does not exercise this migration scenario."
- id: ev-db-expand-contract-2
  card: db-expand-contract
  claim: "CREATE INDEX blocks writes for the whole build while CREATE INDEX CONCURRENTLY does not. The concurrent form cannot run inside a transaction."
  badge: not-exercised
  baseline: v0.1-b2
  limitations: "PostgreSQL documented behaviour."
  reason: "The permission test does not exercise this migration scenario."
