# Tested claims of this guide. See CONTRIBUTING.md, "Evidence".
- id: ev-db-connection-budget-2
  card: db-connection-budget
  claim: "A CONNECTION LIMIT on the runtime role makes a pod that would overrun the budget fail with a clear error instead of exhausting the server."
  badge: reproduced
  limitations: "An isolated PostgreSQL container uses the generated role script and changelog. Enforcement and recovery use a limit of 2 and sequential JDBC logins. This does not prove Hikari pool sizing, concurrent login races, the pod/HPA/rollout budget calculation, PgBouncer behavior or production server capacity."
  test: gradle/single-hexagonal::DatabaseRolesTest
  result: "The generated runtime role has CONNECTION LIMIT 40 and is not a superuser. With its limit temporarily reduced to 2, two JDBC connections succeed and a third is rejected with SQLSTATE 53300 and a message naming the role. An ordinary migrator connection still succeeds while the runtime role is capped. Closing one runtime connection permits another login; the test restores the generated limit afterward."
- id: ev-db-roles-1
  card: db-roles
  claim: "The migration role owns the schema. The runtime role writes business data, cannot drop tables, and can read but not insert/update/delete Liquibase history or lock records."
  badge: reproduced
  test: gradle/single-hexagonal::DatabaseRolesTest
  result: "The migrator owns the schema and its tables. Runtime business CRUD and metadata SELECT succeed; CREATE/ALTER/DROP and all six history/lock writes are rejected with SQLSTATE 42501."
  limitations: "A test-only PostgreSQL container uses the generated role script and changelog. This does not prove Spring Boot data source wiring, pooling, readiness, concurrent migrations or production rollout behavior."
- id: ev-db-testing-1
  card: db-testing
  claim: "Testcontainers 2.0.5 provides org.testcontainers.postgresql.PostgreSQLContainer in the renamed testcontainers-postgresql artifact. @ServiceConnection points the data source at it."
  badge: reproduced
  limitations: "Boot's JDBC auto-configuration with a container bean and typed JdbcConnectionDetails. No application-specific DataSource, production database, migration readiness or Liquibase connection override is tested."
  test: gradle/single-hexagonal::ServiceConnectionTest
  result: "Despite an intentionally wrong datasource URL, username and password, JdbcConnectionDetails and Hikari use the container URL. SQL reads the container database, its username and a marker initialized inside PostgreSQL."
