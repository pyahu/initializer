# Evidence records for the rest-apis guide. See CONTRIBUTING.md, "Evidence".
- id: ev-rest-contract-first-1
  card: rest-contract-first
  claim: "Keeping an OpenAPI 3.1 document in the repository and reviewing it with the code makes every change to the API visible in one file."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Engineering judgment based on the OpenAPI 3.1.2 specification."
  reason: "The example service has no OpenAPI contract yet."
