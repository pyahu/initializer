- id: ev-sec-pod-hardening-1
  card: sec-pod-hardening
  claim: "The image starts with a read-only root filesystem, /tmp as tmpfs and as UID 10001: /readyz answers 200 within 60 s."
  badge: reproduced
  capabilities: [image, runtime]
  components: [temurin-jre-image, spring-boot]
  baseline: v0.1-b1
  fixture: single-hexagonal
  test: acceptance/jvm::TestHardenedStartup
  commands:
    - "docker buildx build --load -t single-hexagonal:ci fixtures/single-hexagonal"
    - "go test -tags acceptance -count=1 -run '^TestHardenedStartup$' ./acceptance/jvm"
  environment: "GitHub-hosted ubuntu-24.04 x64 runner, Docker, images by digest from baseline v0.1-b1"
  run: https://github.com/pyahu/initializer/actions/runs/39062105063/attempts/1
  commit: b3eac8404f59d5951cc889234340baf4ac545d4b
  date: "2026-10-17"
  result: "read-only root, /tmp tmpfs, UID 10001, unreachable OTLP endpoint: /readyz 200 after 2.9 s"
  limitations: "Docker flags stand in for the pod security context; dropped capabilities, seccomp and the service account token are not checked."
- id: ev-sec-pod-hardening-2
  card: sec-pod-hardening
  claim: "The pod security context passes Pod Security admission in a namespace that enforces restricted."
  badge: not-exercised
  baseline: v0.1-b1
