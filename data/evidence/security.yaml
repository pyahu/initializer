  reason: "Needs a cluster; no cluster test runs yet."
- id: ev-sec-pod-hardening-3
  card: sec-pod-hardening
  claim: "A default-deny NetworkPolicy with explicit allows blocks the metadata service at 169.254.169.254."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "A deployment prerequisite; it depends on the cluster's network plugin."
  reason: "Needs a cluster with a NetworkPolicy-enforcing network plugin."
