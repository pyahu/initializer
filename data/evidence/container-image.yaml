# Evidence records for the container-image guide. See CONTRIBUTING.md, "Evidence".
- id: ev-img-layers-1
  card: img-layers
  claim: "The image built from the layered extract (extract --layers without --launcher, started with java -jar) has a usable AOT cache: -XX:AOTMode=on exits 0."
  badge: reproduced
  capabilities: [image]
  components: [java, temurin-jdk-image, temurin-jre-image]
  baseline: v0.1-b1
  fixture: single-hexagonal
  test: acceptance/jvm::TestAOTCacheFailFast
  commands:
    - "docker buildx build --load -t single-hexagonal:ci fixtures/single-hexagonal"
    - "go test -tags acceptance -count=1 -run '^TestAOTCacheFailFast$' ./acceptance/jvm"
  environment: "GitHub-hosted ubuntu-24.04 x64 runner, Docker, images by digest from baseline v0.1-b1"
  run: https://github.com/pyahu/initializer/actions/runs/39062105063/attempts/1
  commit: b3eac8404f59d5951cc889234340baf4ac545d4b
  date: "2026-10-17"
  result: "AOTMode=on with the image's GC and class path: exit 0 (openjdk version \"25.0.4.1\" 2026-08-18 LTS)"
  limitations: "Proves the layout works with the AOT cache, not the layer sizes."
- id: ev-img-layers-2
  card: img-layers
  claim: "With the layered layout a code change only replaces the application jar and AOT cache layers; compressed sizes for one service were about 105 MB base, 48.5 MB dependencies, 0.1 MB application and 23.6 MB AOT cache."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Sizes come from the source guide's registry push of one service on linux/arm64."
  reason: "No test compares the layers of two builds yet."
- id: ev-img-base-image-1
  card: img-base-image
  claim: "Temurin JRE on Ubuntu noble is a sensible default; the plain 25-jre tag moved to Ubuntu 26.04 during 2026, so the codename belongs in the tag."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "The base image comparison comes from registry manifests read by the source guide on 2026-10-04."
  reason: "A comparison of images, not a behaviour a test can run."
- id: ev-img-pinning-1
  card: img-pinning
  claim: "Pinning base images as tag and digest keeps builds stable and Renovate (docker:pinDigests) or Dependabot opens a pull request when the digest behind the tag moves."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Documented Renovate and Dependabot behaviour."
  reason: "No test runs the update bots against the example service yet."
- id: ev-img-non-root-1
  card: img-non-root
  claim: "The image starts with a read-only root filesystem, /tmp as tmpfs, as UID 10001 and with an unreachable OTLP endpoint: /readyz answers 200 within 60 s."
  badge: reproduced
  capabilities: [image, runtime]
  components: [java, temurin-jre-image, spring-boot, spring-framework]
  baseline: v0.1-b1
  fixture: single-hexagonal
  test: acceptance/jvm::TestHardenedStartup
  commands:
    - "docker buildx build --load -t single-hexagonal:ci fixtures/single-hexagonal"
    - "go test -tags acceptance -count=1 -run '^TestHardenedStartup$' ./acceptance/jvm"
  environment: "GitHub-hosted ubuntu-24.04 x64 runner, Docker, images by digest from baseline v0.1-b1"
  run: https://github.com/pyahu/initializer/actions/runs/39062105063/attempts/1
  commit: b3eac8404f59d5951cc889234340baf4ac545d4b
  date: "2026-10-17"
  result: "read-only root, /tmp tmpfs, UID 10001, unreachable OTLP endpoint: /readyz 200 after 2.9 s"
  limitations: "Docker flags stand in for the pod security context; no cluster run yet."
- id: ev-img-non-root-2
  card: img-non-root
  claim: "Without a writable /tmp the embedded Tomcat fails to start with Unable to start web server."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Observed by the source guide with Spring Boot 4.1.1."
  reason: "No test starts the image without a writable /tmp yet."
- id: ev-img-build-context-1
  card: img-build-context
  claim: "Files sent in the build context can end up in a layer and ARG and ENV values stay in the image history; an allow list .dockerignore and BuildKit secret mounts avoid both."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Documented Docker and BuildKit behaviour."
  reason: "The example service's .dockerignore is not an allow list yet and no test inspects the image for secrets."
- id: ev-img-sbom-1
  card: img-sbom
  claim: "The build applies the CycloneDX Gradle plugin and writes a CycloneDX JSON SBOM of the resolved libraries as part of build."
  badge: compiled
  capabilities: [compile]
  components: [gradle, spring-boot, cyclonedx-gradle-plugin]
  baseline: v0.1-b1
  fixture: single-hexagonal
  test: gradle/single-hexagonal::ApplicationTest
  commands:
    - "docker run --rm -v \"$PWD/fixtures/single-hexagonal:/w\" -w /w eclipse-temurin@sha256:a75cd2f1bd3e1e45da898bf658f1f1039ab7392b34844862514d230fd6a516d4 ./gradlew --no-daemon build"
  environment: "GitHub-hosted ubuntu-24.04 x64 runner, Docker, images by digest from baseline v0.1-b1"
  run: https://github.com/pyahu/initializer/actions/runs/39062105063/attempts/1
  commit: b3eac8404f59d5951cc889234340baf4ac545d4b
  date: "2026-10-17"
  result: "io.pyahu.fixture.hexagonal.ApplicationTest: 1 tests, 0 failures, 0 errors, 0 skipped"
  limitations: "build depends on cyclonedxBom and the fixture workflow reads build/sbom/bom.json in the same run; that the SBOM is also packed into the jar is not checked."
