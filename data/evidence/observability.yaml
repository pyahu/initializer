# Tested claims of this guide. See CONTRIBUTING.md, "Evidence".
- id: ev-obs-starter-not-agent-1
  card: obs-starter-not-agent
  claim: "The stage 1 build succeeds with spring-boot-starter-opentelemetry and the OpenTelemetry Logback appender, no Java agent, together with Error Prone, NullAway, Spotless, CycloneDX, Spring Modulith and jMolecules."
  badge: compiled
  test: gradle/single-hexagonal::ApplicationTest
  limitations: "Compiling proves the pins work together, not their runtime behaviour; the other cards prove that."
- id: ev-obs-otlp-config-1
  card: obs-otlp-config
  claim: "With only OTEL_EXPORTER_OTLP_ENDPOINT set, one request's trace, metric and log reach the backend."
  badge: reproduced
  test: acceptance/observability::TestSignalsArrive
  result: "Tempo trace 6840ee0aaf968980f56a37f9d7516175 has server span \"http get /ping\" with uri /ping; Prometheus sum(http_server_requests_seconds_count{service_name=\"single-hexagonal\",uri=\"/ping\"}) = 1; Loki {service_name=\"single-hexagonal\"} | trace_id=\"6840ee0aaf968980f56a37f9d7516175\" returned \"ping\"; 4 more sampled parents at probability 0.1, all 5 traces in Tempo"
  limitations: "Against grafana/otel-lgtm, not a production collector."
- id: ev-obs-logs-otlp-1
  card: obs-logs-otlp
  claim: "A log line written while handling a request reaches Loki with that request's trace_id."
  badge: reproduced
  test: acceptance/observability::TestLogCarriesTraceID
  result: "Loki {service_name=\"single-hexagonal\"} | trace_id=\"cddbc3fb31e8c7c040842c29df36d661\" returned \"ping\""
  limitations: "Against grafana/otel-lgtm."
- id: ev-obs-sampling-1
  card: obs-sampling
  claim: "At sampling probability 0.1, five requests with sampled parents all produce stored traces, so the sampler is parent-based."
  badge: reproduced
  test: acceptance/observability::TestSignalsArrive
  result: "Tempo trace 6840ee0aaf968980f56a37f9d7516175 has server span \"http get /ping\" with uri /ping; Prometheus sum(http_server_requests_seconds_count{service_name=\"single-hexagonal\",uri=\"/ping\"}) = 1; Loki {service_name=\"single-hexagonal\"} | trace_id=\"6840ee0aaf968980f56a37f9d7516175\" returned \"ping\"; 4 more sampled parents at probability 0.1, all 5 traces in Tempo"
  limitations: "A ratio-only sampler would pass this with probability 1e-5."
- id: ev-obs-metric-shape-1
  card: obs-metric-shape
  claim: "With base-time-unit seconds, the request timer arrives as http_server_requests_seconds_count with service_name and uri labels."
  badge: reproduced
  test: acceptance/observability::TestSignalsArrive
  result: "Tempo trace 6840ee0aaf968980f56a37f9d7516175 has server span \"http get /ping\" with uri /ping; Prometheus sum(http_server_requests_seconds_count{service_name=\"single-hexagonal\",uri=\"/ping\"}) = 1; Loki {service_name=\"single-hexagonal\"} | trace_id=\"6840ee0aaf968980f56a37f9d7516175\" returned \"ping\"; 4 more sampled parents at probability 0.1, all 5 traces in Tempo"
  limitations: "Series names in a Prometheus-compatible store; no SLO buckets are configured in the fixture yet."
- id: ev-obs-correlation-1
  card: obs-correlation
  claim: "A latency bucket's exemplar carries the trace_id of a request in it."
  badge: reproduced
  test: acceptance/observability::TestExemplarLinksTrace
  result: "Prometheus exemplar on http_server_requests_seconds_bucket{service_name=\"single-hexagonal\",uri=\"/ping\"} carries trace_id 0d6d439368609ff6e3cb707e28bcad87"
  limitations: "Against grafana/otel-lgtm with exemplar storage on."
- id: ev-obs-actuator-1
  card: obs-actuator
  claim: "/readyz answers on the main port 8080 with add-additional-paths, while Actuator itself runs on 8081."
  badge: reproduced
  test: acceptance/jvm::TestHardenedStartup
  result: "read-only root, /tmp tmpfs, UID 10001, unreachable OTLP endpoint: /readyz 200 after 1.4 s"
  limitations: "Checks /readyz on 8080; it does not probe that 8080 refuses /actuator."
