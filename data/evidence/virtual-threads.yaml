# Tested claims of this guide. See CONTRIBUTING.md, "Evidence".
- id: ev-vt-enable-1
  card: vt-enable
  claim: "The example service builds and its Spring context starts with spring.threads.virtual.enabled: true."
  badge: compiled
  test: gradle/single-hexagonal::ApplicationTest
  limitations: "Proves the setting is accepted, not that requests run on virtual threads; no test logs the request thread yet."
- id: ev-vt-downstream-limits-1
  card: vt-downstream-limits
  claim: "A class-level @ConcurrencyLimit with REJECT shares a limit across methods, immediately rejects excess calls and admits calls again after an in-flight call finishes."
  badge: reproduced
  limitations: "ConcurrencyLimitsTest exercises Spring's real resilience proxy on a controlled client. It does not load test an external service."
  test: gradle/single-hexagonal::ConcurrencyLimitsTest
- id: ev-vt-cpu-work-1
  card: vt-cpu-work
  claim: "With no CPU limit, -XX:ActiveProcessorCount=1 overrides the CPU count the JVM detects, which also sets the number of carrier threads."
  badge: reproduced
  test: acceptance/jvm::TestActiveProcessorCountOverride
  result: "no CPU limit, nproc 4; -XX:ActiveProcessorCount=1 reports Effective CPU Count: 1"
  limitations: "Proves the override only; the carrier count following it is from the JDK documentation."
- id: ev-vt-cpu-work-3
  card: vt-cpu-work
  claim: "A fixed CPU pool with a bounded queue rejects new tasks when its worker and queue are full."
  badge: reproduced
  limitations: "ConcurrencyLimitsTest saturates one real ThreadPoolExecutor worker and one queued task. This proves admission behaviour, not throughput or a production queue size."
  test: gradle/single-hexagonal::ConcurrencyLimitsTest
