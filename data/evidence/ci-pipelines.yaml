# Evidence records for the ci-pipelines guide. See CONTRIBUTING.md, "Evidence".
- id: ev-ci-pin-actions-1
  card: ci-pin-actions
  claim: "An action pinned to a full length commit SHA runs that exact commit, so moving a tag upstream does not change what the workflow runs."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Reasoned from GitHub's secure use reference. This repository's workflows pin every action by SHA but no test moves a tag to show it."
  reason: "No test runs a workflow against a moved tag."
- id: ev-ci-pin-actions-2
  card: ci-pin-actions
  claim: "A workflow dependency lockfile at .github/workflows/actions.lock, generated by gh actions-lock, records the commit and source repository identity of every action, including transitive ones."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Taken from GitHub's documentation of a public preview feature; it may change."
  reason: "This repository does not use a lockfile yet."
- id: ev-ci-permissions-1
  card: ci-permissions
  claim: "Naming any permission in a workflow's permissions block sets every permission not named to none, so contents: read leaves the token read only."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Taken from the GitHub workflow syntax reference. This repository's workflows use it but no test checks what the token can do."
  reason: "No test calls the GitHub API with the workflow token to show a denied write."
- id: ev-ci-pinned-jdk-1
  card: ci-pinned-jdk
  claim: "The Gradle build runs inside the pinned Temurin JDK image by digest and compiles and tests the service with every stage 1 pin."
  badge: compiled
  capabilities: [compile, test]
  components: [java, temurin-jdk-image, gradle]
  baseline: v0.1-b1
  fixture: single-hexagonal
  test: gradle/single-hexagonal::ApplicationTest
  commands:
    - "docker run --rm -v \"$PWD/fixtures/single-hexagonal:/w\" -w /w eclipse-temurin@sha256:a75cd2f1bd3e1e45da898bf658f1f1039ab7392b34844862514d230fd6a516d4 ./gradlew --no-daemon build"
  environment: "GitHub-hosted ubuntu-24.04 x64 runner, Docker, images by digest from baseline v0.1-b1"
  run: https://github.com/pyahu/initializer/actions/runs/39062105063/attempts/1
  commit: b3eac8404f59d5951cc889234340baf4ac545d4b
  date: "2026-10-17"
  result: "io.pyahu.fixture.hexagonal.ApplicationTest: 1 tests, 0 failures, 0 errors, 0 skipped"
  limitations: "Proves the build runs in the pinned image; that the Dockerfile's build stage uses the same digest is checked by evidence verify, not by this test."
- id: ev-ci-cache-1
  card: ci-cache
  claim: "A workflow run restores caches only from its own branch, the default branch and, for a pull request, its base branch; only trusted triggers such as push, workflow_dispatch and schedule can write to the default branch's cache."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Taken from GitHub's dependency caching reference."
  reason: "No test tries to read or poison a cache across branches."
- id: ev-ci-test-order-1
  card: ci-test-order
  claim: "The acceptance tests start the image CI just built: with a read only root, /tmp as tmpfs, UID 10001 and an unreachable OTLP endpoint, /readyz answers 200 within 60 s."
  badge: reproduced
  capabilities: [image, runtime]
  components: [java, temurin-jre-image, spring-boot, spring-framework]
  baseline: v0.1-b1
  fixture: single-hexagonal
  test: acceptance/jvm::TestHardenedStartup
  commands:
    - "docker buildx build --load -t single-hexagonal:ci fixtures/single-hexagonal"
    - "go test -tags acceptance -count=1 -run '^TestHardenedStartup$' ./acceptance/jvm"
  environment: "GitHub-hosted ubuntu-24.04 x64 runner, Docker, images by digest from baseline v0.1-b1"
  run: https://github.com/pyahu/initializer/actions/runs/39062105063/attempts/1
  commit: b3eac8404f59d5951cc889234340baf4ac545d4b
  date: "2026-10-17"
  result: "read-only root, /tmp tmpfs, UID 10001, unreachable OTLP endpoint: /readyz 200 after 2.9 s"
  limitations: "Proves the image is tested after it is built; this repository does not publish the image, so the gate before publishing is not exercised."
- id: ev-ci-publish-1
  card: ci-publish
  claim: "actions/attest writes signed build provenance for an image digest; GitHub documents that artifact attestations alone provide SLSA v1.0 Build Level 2 and Build Level 3 with a shared reusable workflow."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Taken from GitHub's artifact attestation documentation; the levels are stated against SLSA v1.0, while the baseline pins the SLSA 1.2 specification."
  reason: "This repository's pipeline does not push or attest an image."
- id: ev-ci-fast-1
  card: ci-fast
  claim: "A workflow skipped by a paths filter leaves its checks Pending, which blocks a pull request that requires them; a job runs at most 360 minutes unless timeout-minutes sets less."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Taken from the GitHub workflow syntax reference. This repository's workflows use paths filters, concurrency groups and timeouts but no test measures them."
  reason: "No test opens a pull request against a required, path filtered check."
- id: ev-ci-renovate-1
  card: ci-renovate
  claim: "Renovate's helpers:pinGitHubActionDigests preset pins actions and reusable workflows to digests and minimumReleaseAge delays an update until the release is old enough."
  badge: not-exercised
  baseline: v0.1-b1
  limitations: "Taken from the current Renovate documentation; the baseline pins Renovate 44.166.0 and the presets were not checked against that release."
  reason: "This repository has no Renovate configuration yet."
