apiVersion: v1
kind: Service
metadata:
  name: [[name]]-web
  labels:
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: [[name]]
    app.kubernetes.io/instance: [[name]]
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
