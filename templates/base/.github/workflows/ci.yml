# Build, render the manifests, build the image[[#nextjs]]s[[/nextjs]] and start [[^nextjs]]it[[/nextjs]][[#nextjs]]them[[/nextjs]] (CI pipelines guide). Publishing is not here
# yet: add it as a second job that needs this one (CI pipelines guide, steps 5 and 6).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The JDK image of baseline [[baseline]], pinned by digest.
  JDK_IMAGE: eclipse-temurin@[[jdkDigest]]
[[#nextjs]]
  # The Node of frontends/web/.node-version, pinned by digest.
  NODE_IMAGE: node:24.22.0-trixie-slim@sha256:7f486cabe892bff8fef04c0f7da8dba84a560be3e4e2740b7a86afc57ebec315
[[/nextjs]]
[[#postgres]]
  POSTGRES_IMAGE: [[postgresImage]]
[[/postgres]]
[[#oidc]]
  # A mock identity provider, for the smoke test only.
  OIDC_IMAGE: ghcr.io/navikt/mock-oauth2-server:6.0.5@sha256:5ed2f078c6503147860a5114f06414257bb7eeccc68b0e806bdf0869f2602509
[[/oidc]]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle build in the pinned JDK
[[#postgres]]
        # Testcontainers starts PostgreSQL next to this container, through the runner's Docker.
        run: >-
          docker run --rm -v "$PWD:/w" -w /w -v /var/run/docker.sock:/var/run/docker.sock
          "$JDK_IMAGE" ./gradlew --no-daemon build
[[/postgres]]
[[^postgres]]
        run: docker run --rm -v "$PWD:/w" -w /w "$JDK_IMAGE" ./gradlew --no-daemon build
[[/postgres]]
      - name: Render the dev overlay
        uses: docker://registry.k8s.io/kustomize/kustomize:v5.8.3@sha256:429eda4a1c76a7de458d0c4ca3ded9b5d764899ff6bdaeccc1d98b1b6ee873e4
        with:
          args: build deploy/overlays/dev
      - name: Render the prod overlay
        uses: docker://registry.k8s.io/kustomize/kustomize:v5.8.3@sha256:429eda4a1c76a7de458d0c4ca3ded9b5d764899ff6bdaeccc1d98b1b6ee873e4
        with:
          args: build deploy/overlays/prod
[[#nextjs]]
      - name: Frontend types match the contract
        # The types of src/api/schema.d.ts come from the service's contract; a change to one without the other fails
        # here (Next.js guide, step 2). The image build below type checks the rest.
        run: >-
          docker run --rm -v "$PWD:/w" -w /w/frontends/web "$NODE_IMAGE"
          sh -c 'npm ci --no-audit --no-fund && npm run api:check'
[[/nextjs]]
      - name: Image
        run: docker buildx build --load -t [[name]]:ci .
[[#nextjs]]
      - name: Frontend image
        run: docker buildx build --load -t [[name]]-web:ci frontends/web
[[/nextjs]]
      - name: Smoke
        # The containers run the way the pods do: read-only root, a writable /tmp and a user that is not root.
        run: |
          trap 'code=$?; set +e; if [ $code -ne 0 ]; then for c in app[[#nextjs]] web[[/nextjs]][[#postgres]] db[[/postgres]][[#oidc]] oidc[[/oidc]]; do docker logs $c 2>&1 | tail -40; done; fi
            docker rm -f app[[#nextjs]] web[[/nextjs]][[#postgres]] db[[/postgres]][[#oidc]] oidc[[/oidc]] > /dev/null 2>&1; docker network rm smoke > /dev/null 2>&1; exit $code' EXIT
          ready() { for i in $(seq 1 90); do curl -sf "$1" > /dev/null && return 0; sleep 1; done; return 1; }
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          docker network create smoke > /dev/null
[[#postgres]]

          # PostgreSQL with the two roles of db/roles.sql, created the way an admin would (database guide, step 4).
          docker run -d --name db --network smoke -e POSTGRES_PASSWORD=admin -e POSTGRES_DB=[[dbName]] "$POSTGRES_IMAGE"
          for i in $(seq 1 60); do
            docker exec db psql -h 127.0.0.1 -U postgres -d [[dbName]] -c 'SELECT 1' > /dev/null 2>&1 && break
            sleep 1
          done
          docker exec -i db psql -h 127.0.0.1 -U postgres -d [[dbName]] -v ON_ERROR_STOP=1 \
            -v migrator_password=migrator -v app_password=app < db/roles.sql
[[/postgres]]
[[#oidc]]

          # A mock identity provider whose tokens carry the audiences of production: the API[[#nextjs]] and the frontend[[/nextjs]].
          docker run -d --name oidc --network smoke -p 8090:8080 -e JSON_CONFIG='{"tokenCallbacks": [{"issuerId":
            "default", "tokenExpiry": 3600, "requestMappings": [{"requestParam": "client_id", "match": "*", "claims":
            {"sub": "ci-user", "email": "ci@localhost", "aud": ["[[name]]"[[#nextjs]], "[[name]]-web"[[/nextjs]]]}}]}]}' "$OIDC_IMAGE"
          ready localhost:8090/default/.well-known/openid-configuration
[[/oidc]]

          docker run -d --name app --network smoke -p 8080:8080 --read-only --tmpfs /tmp --user 10001:10001 \
            -e MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=false \
[[#postgres]]
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/[[dbName]] \
            -e SPRING_DATASOURCE_USERNAME=[[dbName]]_app -e SPRING_DATASOURCE_PASSWORD=app \
[[/postgres]]
[[#oidc]]
            -e OIDC_ISSUER_URI=http://oidc:8080/default \
[[/oidc]]
            [[name]]:ci
          ready localhost:8080/livez
[[#postgres]]

          # Not ready while a changeset is missing. The migration, run the way the Job runs it, makes it ready
          # (database guide, steps 5 and 6).
          test "$(status localhost:8080/readyz)" = 503
          docker run --rm --network smoke --read-only --tmpfs /tmp --user 10001:10001 \
            -e MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=false \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/[[dbName]] \
            -e SPRING_DATASOURCE_USERNAME=[[dbName]]_migrator -e SPRING_DATASOURCE_PASSWORD=migrator \
            [[name]]:ci --spring.liquibase.enabled=true --spring.main.web-application-type=none
[[/postgres]]
          ready localhost:8080/readyz
[[#oidc]]

          # Only a token issued for this API gets in (security guide, steps 1 and 3). The Host header gives the
          # token the issuer the service knows.
          test "$(status localhost:8080/ping)" = 401
          token=$(curl -sf -H 'Host: oidc:8080' localhost:8090/default/token \
            -d grant_type=client_credentials -d client_id=ci -d client_secret=ci -d scope=[[name]] \
            | tr -d '\n' | sed -E 's/.*"access_token" *: *"([^"]+)".*/\1/')
          auth=(-H "Authorization: Bearer $token")
[[/oidc]]
[[^oidc]]
          auth=()
[[/oidc]]
          curl -sf "${auth[@]}" localhost:8080/ping | grep -q '"message":"pong"'
[[#postgres]]

          # Each ping is counted by the runtime role, in the schema the migration created.
          first=$(curl -sf "${auth[@]}" localhost:8080/ping | sed -E 's/.*"count":([0-9]+).*/\1/')
          second=$(curl -sf "${auth[@]}" localhost:8080/ping | sed -E 's/.*"count":([0-9]+).*/\1/')
          test "$second" -eq $((first + 1))
[[/postgres]]
[[#nextjs]]

          docker run -d --name web --network smoke -p 3000:3000 --read-only --tmpfs /tmp --tmpfs /web/.next/cache \
            --user 1000:1000 -e API_BASE_URL=http://app:8080 \
[[#oidc]]
            -e BETTER_AUTH_URL=http://localhost:3000 -e BETTER_AUTH_SECRET=a-secret-for-this-smoke-test-only \
            -e OIDC_ISSUER_URI=http://oidc:8080/default -e OIDC_CLIENT_ID=[[name]]-web -e OIDC_CLIENT_SECRET=ci \
[[/oidc]]
            [[name]]-web:ci
          ready localhost:3000/livez
[[^oidc]]
          # The page, rendered on the server with the service's answer (Next.js guide, step 1).
          curl -sf localhost:3000/ | grep -q pong
[[/oidc]]
[[#oidc]]
          # Log in through the frontend as a browser would. The frontend runs the code flow on its server, keeps the
          # tokens there and calls the service with the user's token (Next.js guide, step 3).
          curl -sf localhost:3000/ | grep -q 'Sign in'
          jar=$(mktemp)
          login=$(curl -sf -c "$jar" -b "$jar" -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000' \
            -d '{"provider": "oidc", "callbackURL": "/"}' localhost:3000/api/auth/sign-in/social \
            | tr -d '\n' | sed -E 's/.*"url" *: *"([^"]+)".*/\1/')
          # The browser reaches the identity provider on its published port, under the name the frontend knows.
          callback=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Host: oidc:8080' \
            "${login/http:\/\/oidc:8080/http://localhost:8090}")
          curl -sf -o /dev/null -c "$jar" -b "$jar" "$callback"
          page=$(curl -sf -b "$jar" localhost:3000/)
          echo "$page" | grep -q 'ci@localhost'
          echo "$page" | grep -q pong
[[/oidc]]
[[/nextjs]]
