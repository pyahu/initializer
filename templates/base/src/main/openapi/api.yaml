openapi: 3.1.0
info:
  title: [[name]]
  version: 0.1.0
  description: "[[description]]"
tags:
  - name: ping
paths:
  /ping:
    get:
      tags: [ping]
      operationId: ping
      summary: Answers with pong. Replace it with your first real endpoint.
[[#oidc]]
      security:
        - bearer: []
[[/oidc]]
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
[[#oidc]]
        "401":
          description: No valid token for this API.
[[/oidc]]
        default:
          description: Any error, as an RFC 9457 problem detail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
[[#oidc]]
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
[[/oidc]]
  schemas:
    PingResponse:
      type: object
      required: [message[[#postgres]], count[[/postgres]]]
      properties:
        message:
          type: string
          examples: [pong]
[[#postgres]]
        count:
          type: integer
          format: int64
          description: Pings answered so far, counted in the database.
          examples: [1]
[[/postgres]]
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
