# Dev: its namespace and values. A tag is fine here while you rebuild the same image often.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: [[name]]-dev

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: [[name]]-config
    behavior: merge
    literals:
      - DEPLOYMENT_ENVIRONMENT=dev
      - TRACING_SAMPLING_PROBABILITY=1.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability:4318
[[#postgres]]
      # Credentials come from the Secrets [[name]]-db-app and [[name]]-db-migrator, created out of band.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres.example.internal:5432/[[dbName]]
[[/postgres]]
[[#oidc]]
      - OIDC_ISSUER_URI=https://login.example.com/your-tenant
      - OIDC_AUDIENCE=[[name]]
[[/oidc]]
[[#nextjs]]
  - name: [[name]]-web-config
    behavior: merge
    literals:
      - DEPLOYMENT_ENVIRONMENT=dev
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability:4318
[[#oidc]]
      # BETTER_AUTH_SECRET and OIDC_CLIENT_SECRET come from the Secret [[name]]-web-auth, created out of band.
      - BETTER_AUTH_URL=https://[[name]].dev.example.com
      - OIDC_ISSUER_URI=https://login.example.com/your-tenant
      - OIDC_CLIENT_ID=[[name]]-web
[[/oidc]]
[[/nextjs]]

images:
  - name: [[name]]
    newName: ghcr.io/your-org/[[name]]
    newTag: dev
[[#nextjs]]
  - name: [[name]]-web
    newName: ghcr.io/your-org/[[name]]-web
    newTag: dev
[[/nextjs]]

patches:
  # One zone is common in dev: a strict zone rule would leave pods pending.
  - target:
      kind: Deployment
      name: [[name]]
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: ScheduleAnyway
  - target:
      kind: HorizontalPodAutoscaler
      name: [[name]]
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
[[#nextjs]]
  - target:
      kind: Deployment
      name: [[name]]-web
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: ScheduleAnyway
  - target:
      kind: HorizontalPodAutoscaler
      name: [[name]]-web
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
[[/nextjs]]
