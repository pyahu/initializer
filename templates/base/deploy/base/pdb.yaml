apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: [[name]]
  labels:
    app.kubernetes.io/component: api
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: [[name]]
      app.kubernetes.io/instance: [[name]]
      app.kubernetes.io/component: api
