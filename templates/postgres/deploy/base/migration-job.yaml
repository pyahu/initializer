# The migration (database guide, steps 5 and 6): the same image and changelog, run once with the migration role
# before the rollout. A pipeline applies this Job, waits with
#
#   kubectl wait --for=condition=complete job/[[name]]-migrate-0.1.0 --timeout=10m
#
# and only then applies the Deployment; if it fails, the old pods keep serving. The release version is part of the
# name because a Job's pod template cannot change: rename it with every release.
apiVersion: batch/v1
kind: Job
metadata:
  name: [[name]]-migrate-0.1.0
  labels:
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: [[name]]
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: [[name]]
          # Liquibase on, no web server: the process applies the changelog and exits.
          args: ["--spring.liquibase.enabled=true", "--spring.main.web-application-type=none"]
          envFrom:
            - configMapRef:
                name: [[name]]-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=75.0 -XX:ActiveProcessorCount=2
                -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: [[name]]-db-migrator
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: [[name]]-db-migrator
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
