# The frontend: its own image and Deployment, run like the service (Next.js guide, step 6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: start-web
  labels:
    app.kubernetes.io/component: web
spec:
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: start
      app.kubernetes.io/instance: start
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: start
        app.kubernetes.io/instance: start
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: start-web
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Covers the slowest request: Next.js finishes requests in flight on SIGTERM.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        # The node user of the official image.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: start
              app.kubernetes.io/instance: start
              app.kubernetes.io/component: web
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: start
              app.kubernetes.io/instance: start
              app.kubernetes.io/component: web
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: web
          image: start-web
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: start-web-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Where Next.js writes its cache when the root filesystem is read-only.
            - name: cache
              mountPath: /web/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
