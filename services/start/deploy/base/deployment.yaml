apiVersion: apps/v1
kind: Deployment
metadata:
  name: start
  labels:
    app.kubernetes.io/component: api
spec:
  # No replicas: the HorizontalPodAutoscaler owns the count (Kubernetes deployment guide, step 4).
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: start
      app.kubernetes.io/instance: start
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: start
        app.kubernetes.io/instance: start
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: start
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: start
              app.kubernetes.io/instance: start
              app.kubernetes.io/component: api
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: start
              app.kubernetes.io/instance: start
              app.kubernetes.io/component: api
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: app
          image: start
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: start-config
          env:
            # Replaces the image's value, so it repeats the memory flags (JVM in containers guide, steps 1, 3 and 5).
            # ActiveProcessorCount is the CPU request rounded up, at least 2.
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=75.0 -XX:ActiveProcessorCount=2
                -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
