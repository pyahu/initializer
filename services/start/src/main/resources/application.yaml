# One file for every environment: values that change per environment are placeholders with a local
# default, overridden by environment variables from the Deployment (configuration guide, step 1).
spring:
  application:
    name: start
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  # The Initializer: an optional field is absent from the JSON, as the contract says, not null.
  jackson:
    default-property-inclusion: non_null

# The Initializer: generations at once, per pod; more get a 503 (GenerationLimit).
start:
  generation:
    max-concurrent: 16

server:
  forward-headers-strategy: native
  # The form has eight short fields; anything bigger is not a request for a project.
  tomcat:
    max-http-form-post-size: 4KB

logging:
  structured:
    format:
      console: ecs

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        add-additional-paths: true
  opentelemetry:
    resource-attributes:
      service.version: ${APP_VERSION:dev}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:local}
  otlp:
    metrics:
      export:
        base-time-unit: seconds
        step: 30s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

