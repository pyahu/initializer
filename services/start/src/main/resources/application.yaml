# The Initializer service (start.pyahu.io).
spring:
  application:
    name: start
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true

# The form has five short fields; anything bigger is not a request for a project.
server:
  tomcat:
    max-http-form-post-size: 4KB

logging:
  structured:
    format:
      console: ecs

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        add-additional-paths: true
  opentelemetry:
    resource-attributes:
      service.version: ${APP_VERSION:dev}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:local}
  otlp:
    metrics:
      export:
        base-time-unit: seconds
        step: 30s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
